name: Traffic snapshot

on:
  schedule:
    - cron: '17 6 * * 1'   # every Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch GitHub traffic and merge into CSV
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TRAFFIC_TOKEN:-}" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set. The traffic API needs a PAT (repo scope); the default GITHUB_TOKEN cannot read it."
            exit 1
          fi
          api() { curl -sf -H "Authorization: token $TRAFFIC_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/traffic/$1"; }
          api clones > clones.json
          api views  > views.json
          python3 .github/scripts/merge_traffic.py
          rm -f clones.json views.json

      - name: Snapshot skills.sh installs (best-effort, no auth)
        run: |
          set +e
          DISPLAY=$(curl -sL -A "Mozilla/5.0" "https://www.skills.sh/aidevgtm/gtm-cofounder" | python3 .github/scripts/parse_skills.py)
          TODAY=$(date -u +%F)
          if [ -n "$DISPLAY" ]; then
            mkdir -p metrics
            [ -f metrics/skills-installs.csv ] || echo "date,installs_display" > metrics/skills-installs.csv
            grep -v "^$TODAY," metrics/skills-installs.csv > metrics/.t && mv metrics/.t metrics/skills-installs.csv
            echo "$TODAY,$DISPLAY" >> metrics/skills-installs.csv
            echo "skills.sh installs: $DISPLAY"
          else
            echo "skills.sh scrape returned empty; leaving the log unchanged."
          fi

      - name: Rebuild METRICS.md
        run: python3 .github/scripts/build_metrics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add METRICS.md traffic/traffic-daily.csv metrics/skills-installs.csv metrics/manual.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(metrics): weekly snapshot [skip ci]"
            git push
          fi
