name: Validate content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate skills, manifests and workflows
        run: python3 .github/scripts/validate.py
